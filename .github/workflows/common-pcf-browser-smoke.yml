name: Common PCF Browser Smoke

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  common-pcf-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run Common PCF browser smoke
        run: npx playwright test tests/browser/common-pcf-builder.smoke.spec.js --project=chromium

      - name: Run PCF Fixer duplicate-React browser smoke
        run: npx playwright test tests/pcf-fixer.browser.spec.js --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-common-pcf
          path: playwright-report/
          if-no-files-found: ignore
